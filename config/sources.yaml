# ---------------------------------------------------------------------------
# Google Alerts
# 1) https://www.google.com/alerts 에서 아래 예시와 같은 쿼리로 알림 생성
# 2) "전송 방법(Deliver to)"을 "RSS 피드"로 설정
# 3) 생성된 RSS 피드 URL을 각 항목의 url에 붙여넣기
#
# 이 채널은 공식 RSS가 없는 기업 블로그(Circle, Tether, Ondo Finance,
# Securitize, Franklin Templeton, BlackRock BUIDL, Centrifuge, Maple Finance,
# Chainlink, Fireblocks, Paxos, Superstate, Backed Finance 등)와
# MAS/ADGM/RWA.xyz 등 RSS 미확인 소스를 보완하는 핵심 채널입니다.
# ---------------------------------------------------------------------------
google_alerts:
  - name: Google Alerts - RWA 종합
    url: ""   # TODO: Google Alerts RSS URL 붙여넣기
    lang: mixed
    filter: false
    suggested_query: '"real world assets" OR "tokenized fund" OR "tokenized securities" OR RWA tokenization'

  - name: Google Alerts - 스테이블코인
    url: ""
    lang: mixed
    filter: false
    suggested_query: 'stablecoin (regulation OR issuance OR launch) -casino -game'

  - name: Google Alerts - 기업 블로그/발표
    url: ""
    lang: mixed
    filter: false
    suggested_query: '(Circle OR Tether OR "Ondo Finance" OR Securitize OR Centrifuge OR "Maple Finance" OR Chainlink OR Fireblocks OR Paxos OR Superstate) (tokeniz OR "real world asset" OR stablecoin)'

  - name: Google Alerts - 규제기구 보완 (MAS/ADGM/RWA.xyz)
    url: ""
    lang: mixed
    filter: false
    suggested_query: '(site:mas.gov.sg OR site:adgm.com OR site:rwa.xyz) (tokeniz OR "digital asset" OR stablecoin)'

# ---------------------------------------------------------------------------
# X (Twitter)
# 공식 X API v2(Basic tier 이상, 유료)의 bearer token이 .env의 X_BEARER_TOKEN에
# 설정된 경우에만 동작합니다. 미설정 시 자동으로 건너뜁니다.
# 스크래핑 방식(Nitter 등)은 X 이용약관 위반 소지가 있어 채택하지 않았습니다.
# ---------------------------------------------------------------------------
twitter:
  enabled: false   # X_BEARER_TOKEN 설정 후 true로 변경
  handles:
    - Tether_to
    - circle
    - OndoFinance
    - Securitize
    - centrifuge
    - MapleFinance
    - chainlink
    - FireblocksHQ
    - rwa_xyz
    - SECGov
