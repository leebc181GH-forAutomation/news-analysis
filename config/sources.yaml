# =============================================================================
# RWA / Digital Asset / Tokenized Securities&Fund / Stablecoin / On-chain Finance
# 뉴스 수집 소스 정의
#
# 각 항목:
#   name    : 표시용 이름
#   url     : RSS/Atom 피드 URL
#   lang    : en | ko
#   filter  : true  -> keywords.yaml 관련성 필터 적용 (범용 매체용)
#             false -> 필터 없이 전량 수집 (이미 주제가 좁은 전문 소스용)
#   status  : verified(2026-08-17 자동 확인 완료) | unverified(수동 확인 필요)
#
# status: unverified 항목은 url이 비어있거나 추정치입니다. 운영 전 반드시
# `python src/check_sources.py` 로 검증하거나 아래 note의 대안을 사용하세요.
# =============================================================================

media:
  - name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss
    lang: en
    filter: true
    status: verified

  - name: The Block
    url: https://www.theblock.co/rss.xml
    lang: en
    filter: true
    status: verified

  - name: Ledger Insights
    url: https://www.ledgerinsights.com/feed/
    lang: en
    filter: false   # 이미 enterprise blockchain/RWA 전문 매체이므로 필터 불필요
    status: verified

  - name: 토큰포스트
    url: https://www.tokenpost.kr/rss
    lang: ko
    filter: true
    status: verified

  - name: 블록미디어
    url: https://www.blockmedia.co.kr/feed
    lang: ko
    filter: true
    status: verified

  - name: RWA.xyz
    url: ""
    lang: en
    filter: false
    status: unverified
    note: >
      rwa.xyz는 데이터 플랫폼 위주이며 표준 RSS가 자동 확인되지 않았습니다.
      google_alerts 섹션의 "site:rwa.xyz" 알림으로 대체하거나, 사이트 방문 후
      블로그/뉴스 페이지에 RSS 아이콘이 있는지 수동 확인하세요.

regulators:
  - name: SEC (미국 증권거래위원회)
    url: https://www.sec.gov/news/pressreleases.rss
    lang: en
    filter: true
    status: verified

  - name: FINMA (스위스 금융시장감독청)
    url: https://www.finma.ch/en/rss/news/
    lang: en
    filter: true
    status: verified

  - name: HKMA (홍콩 금융관리국)
    url: ""
    lang: en
    filter: true
    status: unverified
    note: >
      HKMA는 RSS 허브 페이지(https://www.hkma.gov.hk/eng/other-information/rss/)를
      운영하나 자동 크롤링으로 정확한 Press Releases 피드 URL을 확정하지 못했습니다.
      위 페이지를 직접 열어 "Press Releases" RSS 링크를 복사해 넣으세요.
      대안으로 공개 API(JSON, 인증 불필요)를 쓸 수 있습니다:
      https://api.hkma.gov.hk/public/press-releases
      (이 경우 src/collect.py의 RSS 파서 대신 별도 JSON 처리 로직이 필요 -
      확장 가이드 참고)

  - name: MAS (싱가포르 통화청)
    url: ""
    lang: en
    filter: true
    status: unverified
    note: >
      수집 시점에 mas.gov.sg가 점검 중이라 자동 확인이 불가했습니다.
      https://www.mas.gov.sg/news 에서 RSS 구독 링크를 수동 확인하세요.
      확인이 어려우면 google_alerts 섹션의 "site:mas.gov.sg" 알림으로 대체하세요.

  - name: ADGM (아부다비 글로벌마켓)
    url: ""
    lang: en
    filter: true
    status: unverified
    note: >
      공식 RSS가 확인되지 않았습니다. google_alerts 섹션의
      "site:adgm.com announcement" 알림으로 대체를 권장합니다.

# ---------------------------------------------------------------------------
# 기업 블로그 / 뉴스룸
# 대부분 표준 RSS가 없으므로 클라우드 routine에서는 WebFetch로 홈페이지/뉴스
# 페이지를 직접 열어 최근 게시물을 추출한다 (AGENT_PROMPT.md 참고). 로컬
